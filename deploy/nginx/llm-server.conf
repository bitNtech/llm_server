# TLS termination + WebSocket/SSE-friendly reverse proxy in front of the gateway.
# /etc/nginx/conf.d/llm-server.conf  (certificates e.g. from certbot)
# With an AWS ALB instead of nginx: target port 8000, health check /health/ready,
# idle timeout >= WS_IDLE_TIMEOUT_S, and FORWARDED_ALLOW_IPS set to the ALB subnet or "*".

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream llm_gateway {
    server 127.0.0.1:8000;
    keepalive 64;
}

server {
    listen 443 ssl;
    http2 on;
    server_name llm.example.com;

    ssl_certificate     /etc/letsencrypt/live/llm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llm.example.com/privkey.pem;

    client_max_body_size 1m;          # keep in line with MAX_REQUEST_BODY_BYTES

    location / {
        proxy_pass http://llm_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;          # stream tokens immediately (SSE)
        proxy_request_buffering off;
        proxy_read_timeout 900s;      # long-lived WebSockets / slow generations
        proxy_send_timeout 900s;
    }

    # Keep metrics private (scrape from inside the VPC on :8000 instead)
    location /metrics { deny all; }
}

server {
    listen 80;
    server_name llm.example.com;
    return 301 https://$host$request_uri;
}
