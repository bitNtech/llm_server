[project]
name = "aica-llm-server"
version = "2.0.0"
description = "Vertex AI inference and orchestration server for real-time voice agents"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: calls the real Vertex AI API (opt-in: LIVE_VERTEX=1 LIVE_GCP_PROJECT=<project> pytest -m live tests/live)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "ASYNC109", "ASYNC110"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "ASYNC210", "ASYNC251", "B017"]
